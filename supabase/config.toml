# Local dev config for the Supabase CLI.
# Remote project ref (set via `supabase link --project-ref ...`): skagtaxusihzeiexfjzr
project_id = "parfett-party"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Local dev only. Public sign-up on the hosted project is controlled in the
# Supabase dashboard; admin accounts are always created server-side.
enable_signup = true

[auth.email]
enabled = true
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false
